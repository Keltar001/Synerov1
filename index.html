<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYNERO - Gestionnaire de Héros</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1613;
            color: #f5f0eb;
            margin: 0;
            padding: 10px;
            padding-bottom: 100px; /* Un peu plus d'espace en bas pour les 2 boutons */
            user-select: none;
            -webkit-user-select: none;
        }

        /* BARRE D'ONGLETS POUR LES HÉROS */
        .tabs-container {
            display: flex;
            gap: 6px;
            margin: 10px 0 15px 0;
            justify-content: center;
        }
        .tab-btn {
            flex: 1;
            max-width: 90px;
            padding: 10px 5px;
            background-color: #26201b;
            border: 1px solid #362e27;
            color: #a89986;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
        }
        .tab-btn.active {
            background-color: #4a1212;
            color: #d4af37;
            border-color: #d4af37;
            box-shadow: 0 0 8px rgba(212, 175, 55, 0.3);
        }

        /* COMPTEUR DE PV DU HÉROS SÉLECTIONNÉ */
        .hp-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 5px 0 25px 0;
            background: linear-gradient(180deg, #2c1a1a 0%, #1a1613 100%);
            padding: 15px 10px;
            border-radius: 12px;
            border: 1px solid #4a1212;
        }
        .hp-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            max-width: 400px;
        }
        .hp-display {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 32px;
            font-weight: bold;
            color: #ff4757;
            text-shadow: 0 0 10px rgba(255, 71, 87, 0.3);
            min-width: 90px;
        }
        .hp-heart {
            font-size: 36px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* TITRES DES SECTIONS */
        .section-title {
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 25px 0 12px 5px;
            padding-left: 8px;
            border-left: 3px solid #fff;
        }
        .title-aura { color: #d4af37; border-left-color: #d4af37; }
        .title-curse { color: #a870e6; border-left-color: #a870e6; }

        /* GRILLE DES STATUTS COMPACTE */
        .status-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        /* BLOC COMPTEUR [-] [ICONE] [+] */
        .status-item {
            background-color: #26201b;
            padding: 6px 8px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            border: 1px solid #362e27;
        }

        /* ZONE ICONE + BADGE NUMÉRIQUE */
        .icon-wrapper {
            position: relative;
            width: 46px;
            height: 46px;
            background-color: #1a1613;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid #443a30;
        }
        .status-icon {
            font-size: 24px; 
        }

        /* Badge du chiffre posé sur l'icône */
        .status-badge {
            position: absolute;
            bottom: -4px;
            right: -4px;
            background-color: #3d352e;
            color: #a89986;
            font-size: 12px;
            font-weight: bold;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid #1a1613;
        }
        
        /* Style quand le compteur est actif (> 0) */
        .status-item.active .icon-wrapper {
            border-color: #55efc4;
            box-shadow: 0 0 8px rgba(85, 239, 196, 0.2);
        }
        .status-item.active .status-badge {
            background-color: #55efc4;
            color: #1a1613;
        }

        /* BOUTONS STYLE JEU / TACTILE */
        .btn {
            width: 34px;
            height: 34px;
            border-radius: 6px;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            background-color: #3a322b;
        }
        .btn:active { transform: scale(0.9); }
        
        /* Boutons PV spécifiques */
        .btn-hp { width: 42px; height: 42px; border-radius: 50%; font-size: 18px; }
        .btn-minus-hp { background-color: #4a2024; color: #ff4757; }
        .btn-plus-hp { background-color: #204a2e; color: #2ed573; }
        .btn-5-hp { background-color: #2d3436; color: #b2bec3; font-size: 13px; }

        /* Boutons + des lignes de statuts */
        .btn-plus-aura { background-color: #d4af37; color: #1a1613; }
        .btn-plus-curse { background-color: #8e44ad; color: #fff; }

        /* DOUBLE BARRE DE RESET FIXE (AMÉLIORÉE) */
        .reset-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #1a1613;
            padding: 12px;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            gap: 10px; /* Espace entre les deux boutons */
        }
        .btn-reset {
            flex: 1;
            max-width: 160px;
            border: none;
            padding: 12px 5px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: white;
            text-align: center;
        }
        .btn-reset-hero {
            background-color: #d35400; /* Orange terre pour un seul héros */
        }
        .btn-reset-all {
            background-color: #c0392b; /* Rouge vif pour le reset total */
        }
    </style>
</head>
<body>

    <!-- BARRE DE SÉLECTION DU HÉROS -->
    <div class="tabs-container">
        <button class="tab-btn active" id="tab-hero1" onclick="changerHero('hero1', 'Héro 1')">Héro 1</button>
        <button class="tab-btn" id="tab-hero2" onclick="changerHero('hero2', 'Héro 2')">Héro 2</button>
        <button class="tab-btn" id="tab-hero3" onclick="changerHero('hero3', 'Héro 3')">Héro 3</button>
        <button class="tab-btn" id="tab-hero4" onclick="changerHero('hero4', 'Héro 4')">Héro 4</button>
    </div>

    <!-- COMPTEUR DE PV DU HÉROS SÉLECTIONNÉ -->
    <div class="hp-section">
        <div id="hp-label" style="font-size: 14px; font-weight: bold; text-transform: uppercase; color: #d4af37; margin-bottom: 8px; letter-spacing: 1px;">Héro 1</div>
        <div class="hp-container">
            <button class="btn btn-hp btn-5-hp" onclick="modifierHP(-5)">-5</button>
            <button class="btn btn-hp btn-minus-hp" onclick="modifierHP(-1)">-</button>
            <div class="hp-display">
                <span class="hp-heart">❤️</span>
                <span id="val-hp">20</span>
            </div>
            <button class="btn btn-hp btn-plus-hp" onclick="modifierHP(1)">+</button>
            <button class="btn btn-hp btn-5-hp" onclick="modifierHP(5)">+5</button>
        </div>
    </div>

    <!-- SECTION AURAS -->
    <div class="section-title title-aura">✨ Auras</div>
    <div class="status-grid" id="auras-container"></div>

    <!-- SECTION CURSES -->
    <div class="section-title title-curse">💀 Curses & Malus</div>
    <div class="status-grid" id="curses-container"></div>

    <!-- BARRE DE REINITIALISATION DOUBLE -->
    <div class="reset-bar">
        <button class="btn-reset btn-reset-hero" onclick="resetHeroActif()">Reset ce Héros</button>
        <button class="btn-reset btn-reset-all" onclick="resetTousLesCompteurs()">Reset les 4 Héros</button>
    </div>

    <script>
        let heroActif = 'hero1';

        const listeAuras = [
            { id: "heal", icon: "💚" },
            { id: "block", icon: "🛡️" },
            { id: "fury", icon: "🔥" },
            { id: "sharp", icon: "⚔️" },
            { id: "bless", icon: "✨" },
            { id: "regen", icon: "🌿" },
            { id: "melee", icon: "🤜" },
            { id: "range", icon: "🏹" },
            { id: "feu", icon: "💥" },
            { id: "froid", icon: "❄️" },
            { id: "holy", icon: "🌟" }
        ];

        const listeCurses = [
            { id: "bleed", icon: "🩸" },
            { id: "poison", icon: "🧪" },
            { id: "sanctify", icon: "⏳" },
            { id: "burn", icon: "♨️" },
            { id: "chill", icon: "🥶" },
            { id: "mark", icon: "🎯" }
        ];

        function initialiserApplication() {
            const aurasContainer = document.getElementById('auras-container');
            const cursesContainer = document.getElementById('curses-container');

            listeAuras.forEach(item => { aurasContainer.innerHTML += creerCardHTML(item, 'aura'); });
            listeCurses.forEach(item => { cursesContainer.innerHTML += creerCardHTML(item, 'curse'); });

            chargerSauvegarde();
        }

        function creerCardHTML(item, type) {
            const plusClass = type === 'aura' ? 'btn-plus-aura' : 'btn-plus-curse';
            return `
                <div class="status-item" id="item-${item.id}">
                    <button class="btn" onclick="modifier('${item.id}', -1)">-</button>
                    <div class="icon-wrapper">
                        <span class="status-icon">${item.icon}</span>
                        <div class="status-badge" id="val-${item.id}">0</div>
                    </div>
                    <button class="btn ${plusClass}" onclick="modifier('${item.id}', 1)">+</button>
                </div>
            `;
        }

        function changerHero(idHero, nomAffichage) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-${idHero}`).classList.add('active');
            document.getElementById('hp-label').innerText = nomAffichage;
            heroActif = idHero;
            chargerSauvegarde();
        }

        function modifier(id, changement) {
            const display = document.getElementById(`val-${id}`);
            const card = document.getElementById(`item-${id}`);
            let v = parseInt(display.innerText) + changement;

            if (v < 0) v = 0;
            if (v > 9) v = 9;

            display.innerText = v;

            if (v > 0) {
                card.classList.add('active');
            } else {
                card.classList.remove('active');
            }

            localStorage.setItem(`${heroActif}_${id}`, v);
        }

        function modifierHP(changement) {
            const display = document.getElementById('val-hp');
            let v = parseInt(display.innerText) + changement;

            if (v < 0) v = 0;

            display.innerText = v;
            localStorage.setItem(`${heroActif}_hp`, v);
        }

        // NOUNEAU : Reset uniquement le héros de l'onglet actif
        function resetHeroActif() {
            const nomHero = document.getElementById(`tab-${heroActif}`).innerText;
            if (confirm(`Réinitialiser uniquement les PV et statuts de : ${nomHero} ?`)) {
                // Supprime la sauvegarde locale de ce héros précis
                localStorage.removeItem(`${heroActif}_hp`);
                listeAuras.forEach(item => localStorage.removeItem(`${heroActif}_${item.id}`));
                listeCurses.forEach(item => localStorage.removeItem(`${heroActif}_${item.id}`));
                
                // Rafraîchit l'écran
                chargerSauvegarde();
            }
        }

        // Reset global (Nettoie toute la table)
        function resetTousLesCompteurs() {
            if (confirm("Voulez-vous réinitialiser l'intégralité des 4 Héros (Effacement total) ?")) {
                localStorage.clear();
                changerHero('hero1', 'Héro 1');
            }
        }

        function chargerSauvegarde() {
            const savedHP = localStorage.getItem(`${heroActif}_hp`);
            document.getElementById('val-hp').innerText = savedHP ? savedHP : "20";

            const badges = document.querySelectorAll('.status-badge');
            badges.forEach(b => {
                const id = b.id.replace('val-', '');
                const savedVal = localStorage.getItem(`${heroActif}_${id}`);
                const valeurNette = savedVal ? parseInt(savedVal) : 0;
                
                b.innerText = valeurNette;
                
                const card = document.getElementById(`item-${id}`);
                if (valeurNette > 0) {
                    card.classList.add('active');
                } else {
                    card.classList.remove('active');
                }
            });
        }

        window.onload = initialiserApplication;
    </script>
</body>
</html>
