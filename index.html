<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYNERO - Compagnon de Combat</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1613;
            color: #f5f0eb;
            margin: 0;
            padding: 10px;
            padding-bottom: 90px;
            user-select: none;
            -webkit-user-select: none;
        }

        /* COMPTEUR DE PV (TOUT EN HAUT & CENTRÉ) */
        .hp-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 15px 0 25px 0;
            background: linear-gradient(180deg, #2c1a1a 0%, #1a1613 100%);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #4a1212;
        }
        .hp-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
        }
        .hp-display {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 36px;
            font-weight: bold;
            color: #ff4757;
            text-shadow: 0 0 10px rgba(255, 71, 87, 0.3);
        }
        .hp-heart {
            font-size: 42px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* TITRES DES SECTIONS */
        .section-title {
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 20px 0 10px 5px;
            padding-left: 8px;
            border-left: 3px solid #fff;
        }
        .title-aura { color: #d4af37; border-left-color: #d4af37; }
        .title-curse { color: #a870e6; border-left-color: #a870e6; }

        /* GRILLE DES STATUTS COMPACTE */
        .status-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1max));
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
        }

        /* BLOC COMPTEUR MINIMALISTE [-] [ICONE] [+] */
        .status-item {
            background-color: #26201b;
            padding: 8px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            border: 1px solid #362e27;
        }

        /* ZONE ICONE + BADGE NUMÉRIQUE */
        .icon-wrapper {
            position: relative;
            width: 46px;
            height: 46px;
            background-color: #1a1613;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid #443a30;
        }
        /* Pour l'instant on utilise des émojis, mais tu pourras mettre des <img src="..."> */
        .status-icon {
            font-size: 24px; 
        }

        /* Badge du chiffre posé sur l'icône */
        .status-badge {
            position: absolute;
            bottom: -4px;
            right: -4px;
            background-color: #3d352e;
            color: #a89986;
            font-size: 12px;
            font-weight: bold;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid #1a1613;
        }
        /* Style quand le compteur est actif (> 0) */
        .status-item.active .icon-wrapper {
            border-color: #55efc4;
            box-shadow: 0 0 8px rgba(85, 239, 196, 0.2);
        }
        .status-item.active .status-badge {
            background-color: #55efc4;
            color: #1a1613;
        }

        /* BOUTONS STYLE MANETTE / JEU */
        .btn {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            background-color: #3a322b;
        }
        .btn:active { transform: scale(0.9); }
        
        /* Différenciation des boutons + */
        .btn-plus-hp { background-color: #ff4757; color: white; width: 44px; height: 44px; font-size: 20px; border-radius: 50%; }
        .btn-minus-hp { background-color: #4a2024; color: white; width: 44px; height: 44px; font-size: 20px; border-radius: 50%; }
        
        .btn-plus-aura { background-color: #d4af37; color: #1a1613; }
        .btn-plus-curse { background-color: #8e44ad; color: #fff; }

        /* BOUTON RESET FIXE */
        .reset-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #1a1613;
            padding: 12px;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
        }
        .btn-reset {
            background-color: #c0392b;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            text-transform: uppercase;
            width: 100%;
            max-width: 250px;
        }
    </style>
</head>
<body>

    <!-- COMPTEUR DE PV DE L'ÉQUIPE -->
    <div class="hp-section">
        <div style="font-size: 11px; text-transform: uppercase; color: #a89986; margin-bottom: 5px; letter-spacing: 1px;">Points de Vie de l'Équipe</div>
        <div class="hp-container">
            <button class="btn btn-minus-hp" onclick="modifierHP(-1)">-</button>
            <div class="hp-display">
                <span class="hp-heart">❤️</span>
                <span id="val-hp">20</span>
            </div>
            <button class="btn btn-plus-hp" onclick="modifierHP(1)">+</button>
        </div>
    </div>

    <!-- SECTION AURAS -->
    <div class="section-title title-aura">✨ Auras</div>
    <div class="status-grid" id="auras-container"></div>

    <!-- SECTION CURSES -->
    <div class="section-title title-curse">💀 Curses & Malus</div>
    <div class="status-grid" id="curses-container"></div>

    <!-- RESET -->
    <div class="reset-bar">
        <button class="btn-reset" onclick="resetTousLesCompteurs()">Nouvelle Partie / Reset</button>
    </div>

    <script>
        // LISTE DE TES STATUTS (Tu peux changer l'émoji par le lien d'une image plus tard si tu veux)
        const listeAuras = [
            { id: "aura_1", icon: "🛡️" },
            { id: "aura_2", icon: "⚔️" },
            { id: "aura_3", icon: "🍃" },
            { id: "aura_4", icon: "💧" },
            { id: "aura_5", icon: "🔥" },
            { id: "aura_6", icon: "☀️" },
            { id: "aura_7", icon: "👑" },
            { id: "aura_8", icon: "👁️" }
        ];

        const listeCurses = [
            { id: "curse_1", icon: "🩸" },
            { id: "curse_2", icon: "🕸️" },
            { id: "curse_3", icon: "🤢" },
            { id: "curse_4", icon: "❄️" },
            { id: "curse_5", icon: "⛓️" },
            { id: "curse_6", icon: "☁️" },
            { id: "curse_7", icon: "🌋" }
        ];

        function initialiserApplication() {
            const aurasContainer = document.getElementById('auras-container');
            const cursesContainer = document.getElementById('curses-container');

            listeAuras.forEach(item => { aurasContainer.innerHTML += creerCardHTML(item, 'aura'); });
            listeCurses.forEach(item => { cursesContainer.innerHTML += creerCardHTML(item, 'curse'); });

            chargerSauvegarde();
        }

        function creerCardHTML(item, type) {
            const plusClass = type === 'aura' ? 'btn-plus-aura' : 'btn-plus-curse';
            return `
                <div class="status-item" id="item-${item.id}">
                    <button class="btn" onclick="modifier('${item.id}', -1)">-</button>
                    <div class="icon-wrapper">
                        <span class="status-icon">${item.icon}</span>
                        <div class="status-badge" id="val-${item.id}">0</div>
                    </div>
                    <button class="btn ${plusClass}" onclick="modifier('${item.id}', 1)">+</button>
                </div>
            `;
        }

        // Gestion des compteurs de statuts (0 à 9)
        function modifier(id, changement) {
            const display = document.getElementById(`val-${id}`);
            const card = document.getElementById(`item-${id}`);
            let v = parseInt(display.innerText) + changement;

            if (v < 0) v = 0;
            if (v > 9) v = 9;

            display.innerText = v;

            if (v > 0) {
                card.classList.add('active');
            } else {
                card.classList.remove('active');
            }

            localStorage.setItem(id, v);
        }

        // Gestion spécifique des PV (Pas de limite haute à 9, s'arrête à 0)
        function modifierHP(changement) {
            const display = document.getElementById('val-hp');
            let v = parseInt(display.innerText) + changement;

            if (v < 0) v = 0;

            display.innerText = v;
            localStorage.setItem('team_hp', v);
        }

        function resetTousLesCompteurs() {
            if (confirm("Remettre les PV à 20 et effacer tous les statuts ?")) {
                document.getElementById('val-hp').innerText = "20";
                const badges = document.querySelectorAll('.status-badge');
                badges.forEach(b => b.innerText = "0");
                
                const items = document.querySelectorAll('.status-item');
                items.forEach(i => i.classList.remove('active'));
                
                localStorage.clear();
            }
        }

        function chargerSauvegarde() {
            // Charger les PV
            const savedHP = localStorage.getItem('team_hp');
            if (savedHP) document.getElementById('val-hp').innerText = savedHP;

            // Charger les statuts
            const badges = document.querySelectorAll('.status-badge');
            badges.forEach(b => {
                const id = b.id.replace('val-', '');
                const savedVal = localStorage.getItem(id);
                if (savedVal && parseInt(savedVal) > 0) {
                    b.innerText = savedVal;
                    document.getElementById(`item-${id}`).classList.add('active');
                }
            });
        }

        window.onload = initialiserApplication;
    </script>
</body>
</html>
